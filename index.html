<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script src="src/config/surfaceConfig.js"></script>
    <script src="src/core/SurfaceMath.js"></script>
    <script src="src/ParametricSurfaceComponent.js"></script>

    <style>
        /* AR.js mutates body width/height/margin every resize. Pin them. */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
            font-family: sans-serif;
        }

        .ar-box {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Force every AR.js / A-Frame display element to fill the box.
           !important is mandatory: AR.js sets inline width/height/margin/z-index
           on every resize, and we need to win every time. */
        .ar-box a-scene,
        .ar-box .a-canvas,
        .ar-box video {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
        }

        /* Video lives at the back of the box; canvas renders 3D on top. */
        .ar-box video    { z-index: 0 !important; object-fit: cover; }
        .ar-box .a-canvas { z-index: 1 !important; }

        #controls {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font: 14px sans-serif;
        }
        #controls label { display: block; cursor: pointer; user-select: none; }
        #controls input { margin-right: 6px; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="controls">
        <label>
            <input type="checkbox" id="renderModelToggle" checked>
            Render model
        </label>
    </div>

    <div class="ar-box">
        <a-scene embedded arjs>
            <a-marker
                type="pattern"
                url="markers/pattern.patt"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5">
                <a-entity
                    parametric-surface
                    rotation="-90 0 0"
                    scale="0.6 0.6 0.6"
                    position="0 0.5 0">
                </a-entity>
            </a-marker>

            <!-- Explicit lights so MeshStandardMaterial textures look right.
                 A-Frame's defaults are dim; these brighten the surface. -->
            <a-entity light="type: ambient; intensity: 0.7"></a-entity>
            <a-entity light="type: directional; intensity: 0.9; color: #fff" position="1 2 1"></a-entity>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <script>
        // AR.js appends its <video> directly to <body>. Move it into .ar-box.
        const box = document.querySelector('.ar-box');
        const observer = new MutationObserver(() => {
            const video = document.querySelector('body > video');
            if (video) {
                box.appendChild(video);
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true });

        // Toggle the parametric surface on/off — leaves marker detection
        // running so the camera + tracking are still active, only the mesh
        // visibility changes.
        document.getElementById('renderModelToggle').addEventListener('change', (e) => {
            const surface = document.querySelector('[parametric-surface]');
            if (surface) surface.setAttribute('visible', e.target.checked);
        });
    </script>
</body>
</html>
